# Тестовая база — H2 в режиме PostgreSQL, чтобы не поднимать Docker для тестов.
spring.datasource.url=jdbc:h2:mem:order_management_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# В тестах схему создаёт Hibernate, поэтому Flyway отключён.
spring.flyway.enabled=false

jwt.secret=test-secret-key-with-at-least-32-characters
jwt.expiration=3600000

app.admin.enabled=false
app.admin.email=admin@test.local
app.admin.password=admin123
