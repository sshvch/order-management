spring.application.name=order-management

# --- База данных ---
# Значения по умолчанию подходят для локального запуска через docker compose.
# В продакшене пароли и секреты задаются через переменные окружения.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/order_management}
spring.datasource.username=${DB_USER:orderhub}
spring.datasource.password=${DB_PASSWORD:orderhub123}

# Схему создаёт Flyway, Hibernate только проверяет, что Entity совпадают с таблицами
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JWT ---
# Секрет должен быть не короче 32 символов. В продакшене обязательно задать свой JWT_SECRET.
jwt.secret=${JWT_SECRET:dev-secret-key-change-me-please-32-bytes-minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- Администратор (создаётся при первом запуске, если его ещё нет) ---
app.admin.enabled=${APP_ADMIN_ENABLED:true}
app.admin.email=${APP_ADMIN_EMAIL:admin@orderhub.local}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
